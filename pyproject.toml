[project]
name = "truckroute"
version = "0.1.0"
description = "Auditable truckstop address normalization and multi-source geocoding"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2.8,<5.3",
  "pydantic>=2.11,<3",
  "rapidfuzz>=3.13,<4",
  "httpx>=0.28,<1",
  "ijson>=3.4,<4",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "duckdb>=1.4,<2",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".venv", "data", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"geocoding/migrations/*.py" = ["E501"]
